name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test scripts/verify-test-shards.test.ts
      # actions.lock pins every action to a commit; rerun gh actions-lock
      # after changing any uses: line.
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  timings:
    # Every shard must read the same timings, or the weighted slices stop
    # covering each file exactly once. Restore them once and hand them out.
    name: Test timings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          sparse-checkout: .github/test-timings.json
          sparse-checkout-cone-mode: false
      # The latest main run's shard timings; PR runs never save this cache.
      - uses: actions/cache/restore@v4.3.0
        with:
          path: bun-test-timings
          key: bun-test-timings-${{ github.run_id }}
          restore-keys: bun-test-timings-
      - name: Fall back to committed timings
        run: |
          if [ -z "$(find bun-test-timings -name '*.json' 2>/dev/null)" ]; then
            mkdir -p bun-test-timings/committed
            cp .github/test-timings.json bun-test-timings/committed/timings.json
          fi
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: test-timings-input
          path: bun-test-timings/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test shard ${{ matrix.shard }}/8
    needs: timings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4.3.0
        with:
          name: test-timings-input
          path: test-timings-input
      # The first --timings path does not exist yet, so Bun writes only this
      # shard's files there for the exactly-once verifier and the cache.
      # --parallel runs one isolated worker per core, slowest files first.
      - name: Run weighted shard
        run: |
          mkdir -p test-results
          inputs=$(find test-timings-input -name '*.json' -printf '--timings=%p ')
          bun test src --shard=${{ matrix.shard }}/8 --parallel --timings=test-results/timings.json $inputs --update-timings --reporter=junit --reporter-outfile=test-results/junit.xml
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error

  save-timings:
    # Only a fully green main run refreshes the timings that later runs read.
    name: Save test timings
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: test-shard-*
          path: test-results
      - name: Collect shard timings
        run: |
          for shard in test-results/test-shard-*; do
            mkdir -p "bun-test-timings/${shard##*/}"
            cp "$shard/timings.json" "bun-test-timings/${shard##*/}/timings.json"
          done
      - uses: actions/cache/save@v4.3.0
        with:
          path: bun-test-timings
          key: bun-test-timings-${{ github.run_id }}

  browser:
    name: Browser shard ${{ matrix.shard }}/2
    # Playwright Core 1.58 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BROWSER_TEST_ARTIFACTS: test-results/browser
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - run: bun install --frozen-lockfile
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      # Use the installed Core CLI, so the browser revision always matches.
      # The hosted image includes Chrome and its runtime libraries. Avoid an
      # unrelated apt repository update on every run. Playwright validates libs.
      - run: bun node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Run browser fixtures
        run: bun test tests/browser --shard=${{ matrix.shard }}/2 --reporter=junit --reporter-outfile=test-results/browser/junit.xml
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: browser-shard-${{ matrix.shard }}
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 7

  check:
    # Preserve the single required branch-protection status, including failures
    # and cancellations in the unit/browser matrices or the independent static checks.
    name: Lint, typecheck, test
    if: always()
    needs: [static, test, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$STATIC_RESULT" = success && test "$TEST_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      # The verifier imports only Bun, so it needs no bun install.
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: test-shard-*
          path: test-results
      - name: Verify every test file ran exactly once
        run: bun scripts/verify-test-shards.ts test-results 8
